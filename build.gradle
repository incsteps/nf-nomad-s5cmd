plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.10'
}

// nf-nomad-s5cmd registers a DistributedWorkdirProviderFactory @Extension on
// nf-nomad's SPI. The compileOnly link below brings in nf-nomad's SPI types
// at compile time without bundling them into the plugin jar (PF4J wires the
// runtime classloader at load time via the Plugin-Dependencies manifest).
def candidatePaths = [
    file('../nf-nomad/build/libs'),
    file('../nf-abc-cluster-dev/plugins/nf-nomad/build/libs'),
]
def nfNomadJar = candidatePaths
        .findResult { dir ->
            dir.exists()
                ? dir.listFiles()?.find { it.name.startsWith('nf-nomad-') && it.name.endsWith('.jar') }
                : null
        }

dependencies {
    if (nfNomadJar) {
        compileOnly files(nfNomadJar)
        testCompileOnly files(nfNomadJar)
        testRuntimeOnly files(nfNomadJar)
    } else {
        logger.warn "nf-nomad-s5cmd: could not find nf-nomad jar in any of ${candidatePaths*.path}; the DistributedWorkdirProvider SPI factory will fail to compile. Build nf-nomad first (e.g. `make bundle` in nf-abc-cluster-dev)."
    }
}

sourceSets {
    test {
        resources {
            srcDirs += ['src/testResources']
        }
    }
}

// Resolve test environment: -PtestEnv=mock|integration (falls back to NF_S5CMD_TEST_ENV env var)
def testEnv = project.hasProperty('testEnv') ? project.property('testEnv') : System.getenv('NF_S5CMD_TEST_ENV') ?: ''

test {
    useJUnitPlatform()
    jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'

    environment 'NF_S5CMD_TEST_ENV', testEnv

    if (testEnv == 'integration') {
        // Integration tests: require s5cmd binary + a reachable S3 endpoint
        environment 'NF_S5CMD_INTEGRATION_TESTS', 'true'
    } else {
        environment 'NF_S5CMD_INTEGRATION_TESTS', 'false'
    }
}

nextflowPlugin {
    nextflowVersion = '25.10.4'
    description = 'High-throughput S3 file staging for Nextflow on Nomad. Registers as a ' +
            'DistributedWorkdirProvider against nf-nomad\'s SPI extension point — currently a ' +
            'Nomad-only integration; requires nf-nomad to be loaded alongside it.'
    provider = 'nf-nomad-s5cmd'
    className = 'nextflow.nomad.s5cmd.NomadS5cmdPlugin'
    extensionPoints = [
            'nextflow.nomad.s5cmd.observer.S5cmdTransferObserverFactory',
            'nextflow.nomad.s5cmd.spi.S5cmdNomadInteropFactory'
    ]
    // PF4J Plugin-Dependencies — wires nf-nomad's classloader as our parent
    // so we can @Extension against nf-nomad's SPI.
    requirePlugins = ['nf-nomad']
}
